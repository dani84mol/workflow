name: Build

on:
  workflow_call:
    secrets:
      APP_TOKEN:
        description: "Token obligatorio para la fase de build"
        required: true

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Validar que el secret no esté vacío
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "::error::El secret APP_TOKEN no está definido o está vacío."
            exit 1
          fi

      - name: Ejecutar build
        run: |
          echo "Compilando aplicación..."