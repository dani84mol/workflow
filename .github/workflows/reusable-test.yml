name: Reusable Test

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
    secrets:
      APP_TOKEN:
        required: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      # Ocultar token en logs usando secrets
      - name: Verificar Secret
        env:
          MY_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          echo "Ejecutando tests para Python ${{ inputs.python-version }}"
          echo "El token está enmascarado en logs: $MY_TOKEN"

      - name: Ejecutar Tests
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m unittest discover