name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Variables de entorno globales
env:
  ENVIRONMENT: "production"
  PROJECT_NAME: "mi-app"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Validación explícita de secret obligatorio
      - name: Verificar Secret requerido
        env:
          SECRET_CHECK: ${{ secrets.MY_SECRET_TOKEN }}
        run: |
          if [ -z "$SECRET_CHECK" ]; then
            echo "::error::El secret MY_SECRET_TOKEN es obligatorio y no fue encontrado en Settings > Secrets."
            exit 1
          fi

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Uso del Token enmascarado
        env:
          MY_TOKEN: ${{ secrets.MY_SECRET_TOKEN }}
        run: |
          echo "Ejecutando tests con Python ${{ matrix.python-version }}"
          echo "Token enmascarado: $MY_TOKEN"

      - name: Ejecutar Tests
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m unittest discover

  call-build:
    needs: test
    uses: ./.github/workflows/build.yml
    secrets:
      APP_TOKEN: ${{ secrets.MY_SECRET_TOKEN }}